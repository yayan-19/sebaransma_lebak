<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">        
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <link rel="stylesheet" href="css/leaflet-measure.css">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <style>
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        #map {
            width: 100%;
            height: calc(100% - 40px);
            margin-top: 40px;
            will-change: transform;
            touch-action: pan-x pan-y;
        }

        .leaflet-tile-container img {
            will-change: transform;
            image-rendering: -webkit-optimize-contrast;
        }

        .leaflet-marker-icon {
            touch-action: manipulation;
        }

        /* Running Text */
        .marquee-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            z-index: 2000 !important;
            background: red;
            font-size: 22px;
            line-height: 40px;
            font-weight: bold;
            overflow: hidden;
            white-space: nowrap;
            box-sizing: border-box;
        }

        .marquee-text {
            display: inline-block;
            color: white;
            padding-left: 100%;
            animation: marquee-anim 15s linear infinite;
            will-change: transform;
        }

        @keyframes marquee-anim {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* Loading Screen Indicator */
        #loader {
            position: fixed;
            top: 40px;
            left: 0;
            width: 100%;
            height: calc(100% - 40px);
            background: rgba(255, 255, 255, 0.9);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            font-weight: bold;
            color: #333;
        }

        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid red;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .leaflet-control-attribution {
            display: none !important;
        }
        </style>
        <title>Peta Sebaran SMA Kabupaten Lebak</title>
    </head>
    <body>
        <div class="marquee-container">
            <div class="marquee-text">Peta sebaran Sekolah SMA di Kabupaten Lebak</div>
        </div>
        
        <!-- Loading Screen -->
        <div id="loader">
            <div class="spinner"></div>
            <div>Memuat Peta & Data...</div>
        </div>

        <div id="map"></div>        

        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>

        <!-- Script Data GeoJSON Di-defer agar Peta & UI muncul dulu -->
        <script defer src="data/BatasWilayahKabLebak_0.js"></script>
        <script defer src="data/JalanKabupaten_1.js"></script>
        <script defer src="data/JalanNasionalnontol_2.js"></script>
        <script defer src="data/JalanKeretaApi_3.js"></script>
        <script defer src="data/StasiunKereta_4.js"></script>
        <script defer src="data/TerminalBis_5.js"></script>
        <script defer src="data/Waduk_6.js"></script>
        <script defer src="data/SebaranSMAdiKabLebak_7.js"></script>
       
        <script>
        var lebakBounds = L.latLngBounds(
            L.latLng(-7.1500, 105.7500), 
            L.latLng(-6.2000, 106.5500)
        );

        // Optimasi Performa Peta & Menghilangkan Animasi Patah-patah saat Zoom
        var map = L.map('map', {
            zoomControl: false,
            maxZoom: 19,
            minZoom: 9,
            maxBounds: lebakBounds,
            maxBoundsViscosity: 0.1,
            preferCanvas: true,            // Menggunakan GPU Canvas renderer
            zoomAnimation: false,          // Menonaktifkan animasi zoom berat
            fadeAnimation: false,          // Menonaktifkan transisi tile
            markerZoomAnimation: false,    // Menghilangkan patah-patah transisi marker
            bounceAtZoomLimits: false,
            tap: true
        }).fitBounds([[-7.016710049423974, 105.1546657624719], [-6.229480013878517, 107.30653303398293]]);

        var layer_GoogleSatellite = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            attribution: 'Google',
            maxZoom: 19,
            updateWhenIdle: true,
            updateWhenZooming: false,
            keepBuffer: 2
        });

        var layer_OpenStreetMap = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19,
            updateWhenIdle: true,
            updateWhenZooming: false,
            keepBuffer: 2
        });

        map.addLayer(layer_GoogleSatellite);

        var hash = new L.Hash(map);
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        var zoomControl = L.control.zoom({ position: 'topleft' }).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'feet',
            secondaryLengthUnit: 'miles',
            primaryAreaUnit: 'sqfeet',
            secondaryAreaUnit: 'sqmiles'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';

        var bounds_group = new L.featureGroup([]);
        function setBounds() {}

        // Inisialisasi Layer GeoJSON setelah file selesai diunduh
        window.addEventListener('load', function() {
            // 0. Batas Wilayah
            var layer_BatasWilayahKabLebak_0 = new L.geoJson(json_BatasWilayahKabLebak_0, {
                interactive: false,
                pane: 'pane_BatasWilayahKabLebak_0',
                style: function() {
                    return { opacity: 1, color: 'rgba(238,239,19,1.0)', dashArray: '5.0,1.0,2.0,1.0', weight: 1.0, fillOpacity: 0 };
                }
            });

            // 1. Jalan Kabupaten
            var layer_JalanKabupaten_1 = new L.geoJson(json_JalanKabupaten_1, {
                interactive: false,
                pane: 'pane_JalanKabupaten_1',
                style: function() { return { opacity: 1, color: 'rgba(255,19,38,1.0)', weight: 1.0, fillOpacity: 0 }; }
            });

            // 2. Jalan Nasional
            var layer_JalanNasionalnontol_2 = new L.geoJson(json_JalanNasionalnontol_2, {
                interactive: false,
                pane: 'pane_JalanNasionalnontol_2',
                style: function() { return { opacity: 1, color: 'rgba(255,19,38,1.0)', weight: 2.0, fillOpacity: 0 }; }
            });

            // 3. Jalan Kereta Api
            var layer_JalanKeretaApi_3 = new L.geoJson(json_JalanKeretaApi_3, {
                interactive: false,
                pane: 'pane_JalanKeretaApi_3',
                style: function() { return { opacity: 1, color: 'rgba(31,120,180,1.0)', weight: 1.0, fillOpacity: 0 }; }
            });

            // 4. Stasiun Kereta
            var layer_StasiunKereta_4 = new L.geoJson(json_StasiunKereta_4, {
                interactive: true,
                onEachFeature: function(f, l) {
                    var val = f.properties['Stasiun KA'] ? autolinker.link(String(f.properties['Stasiun KA'])) : '';
                    l.bindPopup('<b>Stasiun Kereta:</b><br>' + val);
                },
                pointToLayer: function (f, latlng) {
                    return L.marker(latlng, { icon: L.icon({ iconUrl: 'markers/StasiunKereta_4.svg', iconSize: [15.2, 15.2] }) });
                }
            });

            // 5. Terminal Bis
            var layer_TerminalBis_5 = new L.geoJson(json_TerminalBis_5, {
                interactive: true,
                onEachFeature: function(f, l) {
                    var val = f.properties['Terminal B'] ? autolinker.link(String(f.properties['Terminal B'])) : '';
                    l.bindPopup('<b>Terminal Bis:</b><br>' + val);
                },
                pointToLayer: function (f, latlng) {
                    return L.marker(latlng, { icon: L.icon({ iconUrl: 'markers/TerminalBis_5.svg', iconSize: [15.2, 15.2] }) });
                }
            });

            // 6. Waduk
            var layer_Waduk_6 = new L.geoJson(json_Waduk_6, {
                interactive: true,
                onEachFeature: function(f, l) {
                    var val = f.properties['Waduk'] ? autolinker.link(String(f.properties['Waduk'])) : '';
                    l.bindPopup('<b>Waduk:</b><br>' + val);
                },
                pointToLayer: function (f, latlng) {
                    return L.marker(latlng, { icon: L.icon({ iconUrl: 'markers/Waduk_6.svg', iconSize: [15.2, 15.2] }) });
                }
            });

            // 7. Sebaran SMA
            var layer_SebaranSMAdiKabLebak_7 = new L.geoJson(json_SebaranSMAdiKabLebak_7, {
                interactive: true,
                onEachFeature: function(f, l) {
                    var nama = f.properties['Nama_Sekol'] ? autolinker.link(String(f.properties['Nama_Sekol'])) : 'Tidak Ada Nama';
                    l.bindPopup('<div style="font-weight:bold; font-size:14px;">' + nama + '</div>');
                },
                pointToLayer: function (f, latlng) {
                    return L.marker(latlng, { icon: L.icon({ iconUrl: 'markers/SebaranSMAdiKabLebak_7.svg', iconSize: [14, 14] }) });
                }
            });

            // Setup Panes
            map.createPane('pane_BatasWilayahKabLebak_0').style.zIndex = 400;
            map.createPane('pane_JalanKabupaten_1').style.zIndex = 401;
            map.createPane('pane_JalanNasionalnontol_2').style.zIndex = 402;
            map.createPane('pane_JalanKeretaApi_3').style.zIndex = 403;
            map.createPane('pane_StasiunKereta_4').style.zIndex = 404;
            map.createPane('pane_TerminalBis_5').style.zIndex = 405;
            map.createPane('pane_Waduk_6').style.zIndex = 406;
            map.createPane('pane_SebaranSMAdiKabLebak_7').style.zIndex = 407;

            // Tambahkan semua layer ke peta
            map.addLayer(layer_BatasWilayahKabLebak_0);
            map.addLayer(layer_JalanKabupaten_1);
            map.addLayer(layer_JalanNasionalnontol_2);
            map.addLayer(layer_JalanKeretaApi_3);
            map.addLayer(layer_StasiunKereta_4);
            map.addLayer(layer_TerminalBis_5);
            map.addLayer(layer_Waduk_6);
            map.addLayer(layer_SebaranSMAdiKabLebak_7);

            // Layer Tree Menu
            var overlaysTree = [
                {label: '<img src="legend/SebaranSMAdiKabLebak_7.png" /> Sebaran SMA di Kab Lebak', layer: layer_SebaranSMAdiKabLebak_7},
                {label: '<img src="legend/Waduk_6.png" /> Waduk', layer: layer_Waduk_6},
                {label: '<img src="legend/TerminalBis_5.png" /> Terminal Bis ', layer: layer_TerminalBis_5},
                {label: '<img src="legend/StasiunKereta_4.png" /> Stasiun Kereta', layer: layer_StasiunKereta_4},
                {label: '<img src="legend/JalanKeretaApi_3.png" /> Jalan Kereta Api ', layer: layer_JalanKeretaApi_3},
                {label: '<img src="legend/JalanNasionalnontol_2.png" /> Jalan Nasional non tol', layer: layer_JalanNasionalnontol_2},
                {label: '<img src="legend/JalanKabupaten_1.png" /> Jalan Kabupaten ', layer: layer_JalanKabupaten_1},
                {label: '<img src="legend/BatasWilayahKabLebak_0.png" /> Batas Wilayah Kab Lebak', layer: layer_BatasWilayahKabLebak_0},
                {label: 'Google Satellite', layer: layer_GoogleSatellite},
                {label: 'OpenStreetMap', layer: layer_OpenStreetMap}
            ];

            var lay = L.control.layers.tree(null, overlaysTree, { collapsed: true });
            lay.addTo(map);

            resetLabels([layer_BatasWilayahKabLebak_0, layer_SebaranSMAdiKabLebak_7]);
            map.on("zoomend", function(){ resetLabels([layer_BatasWilayahKabLebak_0, layer_SebaranSMAdiKabLebak_7]); });

            // Sembunyikan Indikator Loading
            document.getElementById('loader').style.display = 'none';
        });
        </script>        
    </body>
</html>
