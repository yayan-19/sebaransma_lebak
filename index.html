<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Running Text Header */
        #running-text-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 36px;
            background-color: #d32f2f;
            color: #ffffff;
            z-index: 1000;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        marquee {
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        #map {
            position: absolute;
            top: 36px;
            bottom: 0;
            width: 100%;
            height: calc(100% - 36px);
        }

        /* Hapus Atribusi Permanen */
        .ol-attribution,
        .ol-attribution *,
        [class*="attribution"],
        .qgis2web-attribution {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
            height: 0 !important;
            width: 0 !important;
        }

        /* OPTIMASI RESPONSIF HP: Ukuran Tombol Kontrol (Zoom & Home) */
        .ol-control button {
            width: 44px !important;  /* Ukuran ideal area sentuh jari HP */
            height: 44px !important;
            font-size: 20px !important;
            touch-action: none !important; /* Matikan semua gesture bawaan browser pada tombol */
            cursor: pointer;
        }

        .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        }

        /* Posisi Tombol Home disesuaikan dengan tombol zoom 44px */
        .ol-home {
            top: 98px !important; 
            left: .5em;
        }

        /* Indicator Loading */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.92);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            font-size: 15px;
            color: #333;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #d32f2f;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        </style>
        <title>Peta Sebaran SMA di Kabupaten Lebak</title>
    </head>
    <body>
        <!-- Header Running Text (Anti Google Translate) -->
        <div id="running-text-container" class="notranslate" translate="no">
            <marquee behavior="scroll" direction="left" scrollamount="6" class="notranslate" translate="no">
                <span class="notranslate" translate="no">Peta Sebaran SMA di Kabupaten Lebak</span>
            </marquee>
        </div>

        <!-- Tampilan Loading -->
        <div id="loading-screen">
            <div class="spinner"></div>
            <div>Memuat Peta Sebaran SMA...</div>
        </div>

        <!-- Container Peta -->
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <script src="resources/qgis2web_expressions.js"></script>
        <script src="resources/proj4.js"></script>
        <script>proj4.defs('EPSG:4326','+proj=longlat +datum=WGS84 +no_defs');</script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/Batas_Wilayah_Kab_Lebak_2.js"></script>
        <script src="layers/SebaranSMAdiKabupatenLebak_3.js"></script>
        <script src="styles/Batas_Wilayah_Kab_Lebak_2_style.js"></script>
        <script src="styles/SebaranSMAdiKabupatenLebak_3_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
        
        <script>
            // Anti Google Translate untuk Running Text
            const originalText = "Peta Sebaran SMA di Kabupaten Lebak";
            function enforceOriginalText() {
                var marqueeEl = document.querySelector('#running-text-container marquee');
                if (marqueeEl && marqueeEl.innerText.trim() !== originalText) {
                    marqueeEl.innerHTML = '<span class="notranslate" translate="no">' + originalText + '</span>';
                }
            }
            setInterval(enforceOriginalText, 300);

            // Menghapus elemen atribusi secara periodik
            function removeAttributionElements() {
                var attributions = document.querySelectorAll('.ol-attribution, [class*="attribution"]');
                attributions.forEach(function(el) {
                    el.remove();
                });
            }
            setInterval(removeAttributionElements, 100);

            // Menghilangkan layar loading
            window.addEventListener('load', function() {
                removeAttributionElements();
                enforceOriginalText();
                var loader = document.getElementById('loading-screen');
                if (loader) {
                    loader.style.opacity = '0';
                    loader.style.transition = 'opacity 0.3s ease';
                    setTimeout(function() {
                        loader.style.display = 'none';
                    }, 300);
                }
            });

            // Konfigurasi Peta OpenLayers
            if (typeof map !== 'undefined') {
                map.getControls().forEach(function(control) {
                    if (control instanceof ol.control.Attribution) {
                        map.removeControl(control);
                    }
                });

                var view = map.getView();

                // Kunci rotasi ke Atas/Utara
                view.setRotation(0);
                map.getInteractions().forEach(function(interaction) {
                    if (interaction instanceof ol.interaction.DragRotate || 
                        interaction instanceof ol.interaction.PinchRotate) {
                        map.removeInteraction(interaction);
                    }
                });

                // Bebaskan batasan zoom
                view.setMinZoom(0);
                view.setMaxZoom(28);

                var initialCenter = view.getCenter();
                var initialZoom = view.getZoom();

                // 1. PEMBUATAN TOMBOL HOME (INSTAN TOUCH RESPONSIF)
                var homeButton = document.createElement('button');
                homeButton.innerHTML = '<i class="fas fa-home"></i>';
                homeButton.title = 'Kembali ke tampilan awal';
                
                function resetViewInstantly(e) {
                    if (e) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                    // Tanpa durasi animasi agar responsnya lompat seketika
                    view.setCenter(initialCenter);
                    view.setZoom(initialZoom);
                }

                // Menggunakan touchstart agar bereaksi instan saat sentuhan pertama jari
                homeButton.addEventListener('touchstart', resetViewInstantly, { passive: false });
                homeButton.addEventListener('click', resetViewInstantly);

                var homeElement = document.createElement('div');
                homeElement.className = 'ol-home ol-unselectable ol-control';
                homeElement.appendChild(homeButton);

                map.addControl(new ol.control.Control({
                    element: homeElement
                }));

                // 2. PEMAKSAAN TOMBOL ZOOM BAWAAN (+ / -) AGAR RESPONTIF DI HP
                setTimeout(function() {
                    var zoomButtons = document.querySelectorAll('.ol-zoom button');
                    zoomButtons.forEach(function(btn) {
                        btn.addEventListener('touchstart', function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            if (btn.classList.contains('ol-zoom-in')) {
                                view.setZoom(view.getZoom() + 1);
                            } else if (btn.classList.contains('ol-zoom-out')) {
                                view.setZoom(view.getZoom() - 1);
                            }
                        }, { passive: false });
                    });
                }, 400);

                // 3. RESPONSIVITAS TAP FITUR / TITIK PETA DI HP
                map.on('singleclick', function(evt) {
                    var feature = map.forEachFeatureAtPixel(evt.pixel, function(feature) {
                        return feature;
                    }, {
                        hitTolerance: 20 // Jangkauan toleransi ketukan jari diperbesar
                    });
                });
            }
        </script>
    </body>
</html>
