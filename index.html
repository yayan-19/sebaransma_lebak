<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Running Text Header */
        .marquee-header {
            background-color: #ff0000; /* Background Merah */
            color: #ffffff; /* Tulisan Putih */
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            padding: 6px 0;
            z-index: 1000;
            flex-shrink: 0;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.2);
        }

        .marquee-header marquee {
            display: block;
        }

        /* Map Container */
        #map {
            width: 100%;
            flex-grow: 1;
            position: relative;
        }

        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        }

        /* Sembunyikan Kontrol Atribusi via CSS */
        .ol-attribution,
        .ol-attribution *,
        a[href*="qgis2web"],
        a[href*="openlayers"],
        a[href*="qgis"] {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        /* Loading Screen */
        #map-loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: #333333;
        }

        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #ff0000;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        </style>
        <title>Peta Sebaran SMA di Kabupaten Lebak</title>
    </head>
    <body>
        <!-- Running Text -->
        <div class="marquee-header">
            <marquee behavior="scroll" direction="left" scrollamount="6">
                Peta Sebaran SMA di Kabupaten Lebak
            </marquee>
        </div>

        <!-- Element Peta -->
        <div id="map">
            <!-- Indikator Loading -->
            <div id="map-loading">
                <div class="spinner"></div>
                <div>Memuat Peta...</div>
            </div>

            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/Batas_Wilayah_Kab_Lebak_2.js"></script><script src="layers/SebaranSMAdiKabupatenLebak_3.js"></script>
        <script src="styles/Batas_Wilayah_Kab_Lebak_2_style.js"></script><script src="styles/SebaranSMAdiKabupatenLebak_3_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>

        <script>
            document.addEventListener("DOMContentLoaded", function() {
                if (typeof map !== 'undefined') {
                    // 1. Kunci Peta Agar Tetap Menghadap Utara
                    var currentView = map.getView();
                    if (currentView) {
                        map.setView(new ol.View({
                            center: currentView.getCenter(),
                            zoom: currentView.getZoom(),
                            projection: currentView.getProjection(),
                            rotation: 0,
                            enableRotation: false
                        }));
                    }

                    // 2. Hapus Atribusi qgis2web/OpenLayers/QGIS langsung dari Objek Map
                    map.getControls().forEach(function(control) {
                        if (control instanceof ol.control.Attribution) {
                            map.removeControl(control);
                        }
                    });

                    // 3. Modifikasi forEachFeatureAtPixel agar semua klik di HP memiliki toleransi sentuhan 20px
                    var origForEachFeature = map.forEachFeatureAtPixel.bind(map);
                    map.forEachFeatureAtPixel = function(pixel, callback, options) {
                        options = options || {};
                        options.hitTolerance = 20; // Memperbesar radius klik untuk layar HP
                        return origForEachFeature(pixel, callback, options);
                    };
                }
            });

            // 4. Sembunyikan Loading Screen Setelah Peta Siap
            window.addEventListener('load', function() {
                var loadingEl = document.getElementById('map-loading');
                if (loadingEl) {
                    loadingEl.style.opacity = '0';
                    loadingEl.style.transition = 'opacity 0.4s ease';
                    setTimeout(function() {
                        loadingEl.style.display = 'none';
                    }, 400);
                }
            });
        </script>
    </body>
</html>
