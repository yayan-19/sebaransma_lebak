<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        /* Header Running Text */
        #running-text-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 36px;
            background-color: #d32f2f; /* Warna Merah */
            color: #ffffff;            /* Warna Putih */
            z-index: 1000;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        marquee {
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Adjust Map Container agar tidak tertutup Running Text */
        #map {
            position: absolute;
            top: 36px;
            bottom: 0;
            width: 100%;
            height: calc(100% - 36px);
        }

        /* Sembunyikan Atribusi (qgis2web, OpenLayers, QGIS) Secara Permanen & Menyeluruh */
        .ol-attribution,
        .ol-attribution *,
        [class*="attribution"],
        .qgis2web-attribution {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
            height: 0 !important;
            width: 0 !important;
        }

        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        }

        /* Position Tombol Home agar tidak menutupi kontrol lain */
        .ol-home {
            top: 68px;
            left: .5em;
        }
        .ol-home button {
            font-weight: bold;
            cursor: pointer;
        }

        /* Indicator Loading Overlay */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.92);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            font-size: 15px;
            color: #333;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #d32f2f;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        </style>
        <title>Peta Sebaran SMA di Kabupaten Lebak</title>
    </head>
    <body>
        <!-- Header Running Text dengan Atribut Anti Google Translate -->
        <div id="running-text-container" class="notranslate" translate="no">
            <marquee behavior="scroll" direction="left" scrollamount="6" class="notranslate" translate="no">
                <span class="notranslate" translate="no">Peta Sebaran SMA di Kabupaten Lebak</span>
            </marquee>
        </div>

        <!-- Tampilan Loading -->
        <div id="loading-screen">
            <div class="spinner"></div>
            <div>Memuat Peta Sebaran SMA...</div>
        </div>

        <!-- Container Peta -->
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <script src="resources/qgis2web_expressions.js"></script>
        <script src="resources/proj4.js"></script>
        <script>proj4.defs('EPSG:4326','+proj=longlat +datum=WGS84 +no_defs');</script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/Batas_Wilayah_Kab_Lebak_2.js"></script>
        <script src="layers/SebaranSMAdiKabupatenLebak_3.js"></script>
        <script src="styles/Batas_Wilayah_Kab_Lebak_2_style.js"></script>
        <script src="styles/SebaranSMAdiKabupatenLebak_3_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
        
        <script>
            // Mencegah perubahan teks oleh Google Translate secara otomatis
            const originalText = "Peta Sebaran SMA di Kabupaten Lebak";
            
            function enforceOriginalText() {
                var marqueeEl = document.querySelector('#running-text-container marquee');
                if (marqueeEl && marqueeEl.innerText.trim() !== originalText) {
                    marqueeEl.innerHTML = '<span class="notranslate" translate="no">' + originalText + '</span>';
                }
            }

            // Pengecekan rutin setiap 300ms untuk mengembalikan teks asli jika diubah penerjemah
            setInterval(enforceOriginalText, 300);

            // Fungsi untuk menghapus teks atribusi dari DOM secara total dan permanen
            function removeAttributionElements() {
                var attributions = document.querySelectorAll('.ol-attribution, [class*="attribution"]');
                attributions.forEach(function(el) {
                    el.remove();
                });
            }

            // Jalankan pembersihan atribusi secara berkala
            setInterval(removeAttributionElements, 100);

            // Hilangkan layar loading ketika peta selesai dimuat
            window.addEventListener('load', function() {
                removeAttributionElements();
                enforceOriginalText();
                var loader = document.getElementById('loading-screen');
                if (loader) {
                    loader.style.opacity = '0';
                    loader.style.transition = 'opacity 0.5s ease';
                    setTimeout(function() {
                        loader.style.display = 'none';
                    }, 500);
                }
            });

            // Konfigurasi tambahan pada OpenLayers Map
            if (typeof map !== 'undefined') {
                // Hapus Attribution Control dari instans OpenLayers Map
                map.getControls().forEach(function(control) {
                    if (control instanceof ol.control.Attribution) {
                        map.removeControl(control);
                    }
                });

                var view = map.getView();

                // Menjaga peta agar selalu mengarah ke Atas/Utara & mencegah rotasi
                view.setRotation(0);
                map.getInteractions().forEach(function(interaction) {
                    if (interaction instanceof ol.interaction.DragRotate || 
                        interaction instanceof ol.interaction.PinchRotate) {
                        map.removeInteraction(interaction);
                    }
                });

                // Simpan koordinat awal dan zoom awal untuk fitur Tombol Home
                var initialCenter = view.getCenter();
                var initialZoom = view.getZoom();

                // Tombol Home khusus untuk reset tampilan
                var homeButton = document.createElement('button');
                homeButton.innerHTML = '<i class="fas fa-home"></i>';
                homeButton.title = 'Kembali ke tampilan awal';
                
                homeButton.addEventListener('click', function() {
                    view.animate({
                        center: initialCenter,
                        zoom: initialZoom,
                        duration: 500
                    });
                });

                var homeElement = document.createElement('div');
                homeElement.className = 'ol-home ol-unselectable ol-control';
                homeElement.appendChild(homeButton);

                map.addControl(new ol.control.Control({
                    element: homeElement
                }));

                // Optimasi klik layar HP dengan hitTolerance
                map.on('singleclick', function(evt) {
                    var feature = map.forEachFeatureAtPixel(evt.pixel, function(feature) {
                        return feature;
                    }, {
                        hitTolerance: 12 // Area toleransi sentuhan jari pada layar ponsel
                    });
                });
            }
        </script>
    </body>
</html>
